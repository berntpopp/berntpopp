name: Update SEO Files

on:
  push:
    branches: [main, refactor-js]
    paths:
      - 'portfolio/**/*.md'
      - 'portfolio/seo/**/*.json'
      - 'portfolio/public/bp.bib'
      - 'portfolio/scripts/generate-seo.js'
      - '.github/workflows/seo-update.yml'
  schedule:
    # Run weekly to ensure sitemap stays fresh
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update-seo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json
      
      - name: Install dependencies
        working-directory: ./portfolio
        run: |
          npm ci
          npm install glob
      
      - name: Generate SEO files
        working-directory: ./portfolio
        run: |
          echo "🚀 Generating SEO files..."
          node scripts/generate-seo.js
          
          echo "📋 SEO files generated:"
          ls -la public/sitemap.xml public/robots.txt
          ls -la seo/generated-schemas.json seo/health-report.json
          ls -la .vitepress/theme/seo.js
      
      - name: Display SEO health report
        working-directory: ./portfolio
        run: |
          echo "📊 SEO Health Report:"
          cat seo/health-report.json | jq '.'
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check for changes
          if [[ -n $(git status --porcelain) ]]; then
            git add portfolio/public/sitemap.xml \
                    portfolio/public/robots.txt \
                    portfolio/seo/generated-schemas.json \
                    portfolio/seo/health-report.json \
                    portfolio/.vitepress/theme/seo.js
            
            git commit -m "chore: update SEO files [skip ci]
            
            - Updated sitemap.xml with latest pages
            - Regenerated structured data schemas
            - Updated SEO health report
            
            Generated by GitHub Actions"
            
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️  No changes to commit"
          fi
      
      - name: Upload SEO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: |
            portfolio/seo/health-report.json
            portfolio/public/sitemap.xml
          retention-days: 30